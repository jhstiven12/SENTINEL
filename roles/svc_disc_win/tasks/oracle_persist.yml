---
# =============================================================================
# roles/svc_disc_win/tasks/oracle_persist.yml
# Itera svc_disc_win_sentinel_services via include_tasks (loop en block
# no está soportado en Ansible — se usa include_tasks por servicio)
# =============================================================================

- name: Svc_disc_win | oracle | Persistir servicios de {{ inventory_hostname }}
  block:
    - name: Svc_disc_win | oracle | Procesar servicio por servicio
      ansible.builtin.include_tasks: oracle_persist_item.yml
      loop: "{{ svc_disc_win_sentinel_services | default([]) }}"
      loop_control:
        loop_var: svc_disc_win_svc
        label: "{{ svc_disc_win_svc.service_name }}"
      tags: [oracle_insert, services]

  rescue:
    - name: Svc_disc_win | oracle | ERROR en bloque de persistencia
      ansible.builtin.debug:
        msg: >-
          [ERROR] svc_disc_win — Oracle falló para {{ inventory_hostname }}.
          {{ ansible_failed_result.msg | default('desconocido') }}
      tags: [oracle_insert]
