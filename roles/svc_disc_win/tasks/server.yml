---
# =============================================================================
# roles/svc_disc_win/tasks/server.yml
# =============================================================================

- name: Svc_disc_win | server | Upsert OBS_SERVER para {{ inventory_hostname }}
  block:
    - name: Svc_disc_win | server | Generar svc_disc_win_server_id
      ansible.builtin.set_fact:
        svc_disc_win_server_id: "{{ inventory_hostname | to_uuid }}"
        cacheable: false
      tags: [servers]

    - name: Svc_disc_win | server | Construir svc_disc_win_os_label
      ansible.builtin.set_fact:
        svc_disc_win_os_label: >-
          {{ ansible_os_name | default(ansible_distribution)
          }} {{ ansible_os_version | default(ansible_distribution_version) }}
        cacheable: false
      tags: [servers]

    - name: Svc_disc_win | server | Resolver svc_disc_win_server_ip
      ansible.builtin.set_fact:
        svc_disc_win_server_ip: >-
          {{ ansible_ip_addresses[0]
             | default(ansible_all_ipv4_addresses[0] | default('0.0.0.0')) }}
        cacheable: false
      tags: [servers]

    - name: Svc_disc_win | server | MERGE OBS_SERVER
      opitzconsulting.ansible_oracle.oracle_sql:
        hostname: "{{ svc_disc_win_oracle_host }}"
        port: "{{ svc_disc_win_oracle_port }}"
        service_name: "{{ svc_disc_win_oracle_service }}"
        username: "{{ svc_disc_win_oracle_user }}"
        password: "{{ svc_disc_win_oracle_password }}"
        mode: "sysdba"
        sql: >-
          MERGE INTO {{ svc_disc_win_oracle_schema }}.OBS_SERVER tgt
          USING (SELECT '{{ inventory_hostname }}' AS hostname FROM dual) src
          ON (tgt.HOSTNAME = src.hostname)
          WHEN MATCHED THEN
            UPDATE SET tgt.IP_ADDRESS       = '{{ svc_disc_win_server_ip }}',
                       tgt.OPERATING_SYSTEM = '{{ svc_disc_win_os_label | truncate(50, true, "") | replace("'", "''") }}',
                       tgt.ENVIRONMENT      = '{{ svc_disc_win_environment }}'
          WHEN NOT MATCHED THEN
            INSERT (SERVER_ID, HOSTNAME, IP_ADDRESS, OPERATING_SYSTEM, ENVIRONMENT)
            VALUES ('{{ svc_disc_win_server_id }}', '{{ inventory_hostname }}',
                    '{{ svc_disc_win_server_ip }}',
                    '{{ svc_disc_win_os_label | truncate(50, true, "") | replace("'", "''") }}',
                    '{{ svc_disc_win_environment }}')
      environment:
        ORACLE_HOME: /opt/oracle/instantclient
        LD_LIBRARY_PATH: /opt/oracle/instantclient
      vars:
        ansible_python_interpreter: /usr/bin/python3
      no_log: false
      delegate_to: "{{ svc_disc_win_oracle_db_node }}"
      tags: [servers, oracle_insert]

  rescue:
    - name: Svc_disc_win | server | ERROR en upsert OBS_SERVER
      ansible.builtin.debug:
        msg: >-
          [ERROR] svc_disc_win — OBS_SERVER falló para {{ inventory_hostname }}.
          {{ ansible_failed_result.msg | default('desconocido') }}
      tags: [servers]
