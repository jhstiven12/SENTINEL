---
# =============================================================================
# roles/svc_disc_rhel/tasks/java_detection.yml
# Detecta todos los procesos JVM en ejecución (java/java.exe) que NO estén
# ya cubiertos por un servicio systemd.
#
# Variables producidas:
#   svc_disc_rhel_java_services — lista de dicts con el mismo esquema
#                                 que svc_disc_rhel_parsed_services pero
#                                 originados en procesos JVM directos.
#
# Estrategia de detección:
#   1. ps filtra líneas donde el binario ejecutable es "java"
#   2. Del cmdline se extrae el nombre de servicio:
#      - "-jar app.jar"              → nombre = "app"
#      - "com.example.Application"  → nombre = última clase
#      - "-Dcatalina.home"           → nombre = "tomcat-<port>"
#      - fallback                    → "java-<pid>"
#   3. Se determina tecnología buscando keywords en el cmdline completo
#   4. Se obtiene versión JVM via readlink /proc/PID/exe + -version
#   5. Se cruza con svc_disc_rhel_pid_ports para asociar puertos
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Obtener todos los procesos java con stats de ps
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Listar procesos JVM via ps
  block:
    - name: Svc_disc_rhel | java | ps — buscar binarios java
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          ps -eo pid,user,pcpu,rss,etime,args --no-headers 2>/dev/null |
          awk '
            $6 ~ /\/java$/ || $6 ~ /^java$/ {
              print $1"|"$2"|"$3"|"$4"|"$5"|"substr($0, index($0,$6))
            }
          '
        executable: /bin/bash
      register: svc_disc_rhel_java_ps_raw
      changed_when: false
      timeout: "{{ svc_disc_rhel_discovery_timeout }}"
      tags: [discovery, java]

  rescue:
    - name: Svc_disc_rhel | java | ERROR en ps java
      ansible.builtin.debug:
        msg: "[ERROR] svc_disc_rhel — ps java falló: {{ ansible_failed_result.msg | default('desconocido') }}"
      tags: [discovery, java]

  always:
    - name: Svc_disc_rhel | java | Garantizar svc_disc_rhel_java_ps_raw
      ansible.builtin.set_fact:
        svc_disc_rhel_java_ps_raw: "{{ svc_disc_rhel_java_ps_raw | default({'stdout_lines': []}) }}"
        cacheable: false
      tags: [discovery, java]

# ---------------------------------------------------------------------------
# 2. Obtener PIDs de servicios systemd ya conocidos (para excluirlos)
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Construir set de PIDs ya gestionados por systemd
  ansible.builtin.set_fact:
    svc_disc_rhel_systemd_pids: >-
      {{
        svc_disc_rhel_parsed_services | default([])
        | map(attribute='MainPID', default='0')
        | map('trim')
        | reject('eq', '0') | reject('eq', '')
        | list | unique
      }}
    cacheable: false
  tags: [discovery, java]

# ---------------------------------------------------------------------------
# 3. Parsear filas de ps java en lista de dicts
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Parsear svc_disc_rhel_java_raw_list
  ansible.builtin.set_fact:
    svc_disc_rhel_java_raw_list: >-
      {%- set ns = namespace(r=[]) -%}
      {%- for line in svc_disc_rhel_java_ps_raw.stdout_lines | default([]) -%}
        {%- set cols = line.split('|') -%}
        {%- if cols|length >= 6 -%}
          {%- set pid = cols[0]|trim -%}
          {%- if pid not in svc_disc_rhel_systemd_pids -%}
            {%- set _ = ns.r.append({
              'pid': pid,
              'user': cols[1]|trim,
              'cpu': cols[2]|trim,
              'rss_kb': cols[3]|trim,
              'etime': cols[4]|trim,
              'cmdline': cols[5:]|join('|')|trim
            }) -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.r }}
    cacheable: false
  tags: [discovery, java]

# ---------------------------------------------------------------------------
# 4. Obtener versión JVM de cada proceso via readlink + -version
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Obtener versión JVM por proceso
  ansible.builtin.shell:
    cmd: >
      java_bin=$(readlink -f /proc/{{ svc_disc_rhel_java_ver_item.pid }}/exe 2>/dev/null);
      [ -x "$java_bin" ] && "$java_bin" -version 2>&1 | head -1 || echo "unknown"
    executable: /bin/bash
  register: svc_disc_rhel_java_ver_raw
  changed_when: false
  loop: "{{ svc_disc_rhel_java_raw_list | default([]) }}"
  loop_control:
    loop_var: svc_disc_rhel_java_ver_item
    label: "java PID {{ svc_disc_rhel_java_ver_item.pid }}"
  ignore_errors: true   # noqa: ignore-errors — best-effort
  timeout: 10
  tags: [discovery, java]

# ---------------------------------------------------------------------------
# 5. Construir svc_disc_rhel_java_ver_map { pid -> version_string }
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Construir svc_disc_rhel_java_ver_map
  ansible.builtin.set_fact:
    svc_disc_rhel_java_ver_map: >-
      {%- set ns = namespace(r={}) -%}
      {%- for idx in range(svc_disc_rhel_java_raw_list | default([]) | length) -%}
        {%- set pid = svc_disc_rhel_java_raw_list[idx].pid -%}
        {%- set ver = svc_disc_rhel_java_ver_raw.results[idx].stdout
                      | default('unknown') | trim -%}
        {%- set _ = ns.r.update({pid: ver[:200]}) -%}
      {%- endfor -%}
      {{ ns.r }}
    cacheable: false
  tags: [discovery, java]

# ---------------------------------------------------------------------------
# 6. Normalizar en svc_disc_rhel_java_services con el esquema canónico
# ---------------------------------------------------------------------------
- name: Svc_disc_rhel | java | Construir svc_disc_rhel_java_services
  ansible.builtin.set_fact:
    svc_disc_rhel_java_services: >-
      {%- set ns = namespace(svcs=[]) -%}
      {%- for proc in svc_disc_rhel_java_raw_list | default([]) -%}

        {%- set cmdline = proc.cmdline -%}
        {%- set pid     = proc.pid -%}

        {# ── Extraer nombre de servicio del cmdline ── #}
        {%- set svc_name = 'java-' ~ pid -%}

        {%- if '-jar ' in cmdline -%}
          {# Tomar el nombre del .jar sin extensión ni ruta #}
          {%- set jar_part = cmdline.split('-jar ')[1].split()[0] -%}
          {%- set jar_base = jar_part.split('/')[-1] | regex_replace('\\.jar.*$','') -%}
          {%- set svc_name = jar_base | regex_replace('-[0-9].*$','') -%}
        {%- elif ' org.' in cmdline or ' com.' in cmdline or ' io.' in cmdline -%}
          {# Tomar la última parte del fully-qualified class name #}
          {%- set main_class = cmdline.split()[-1] -%}
          {%- set svc_name   = main_class.split('.')[-1] -%}
        {%- elif '-Dcatalina' in cmdline or 'catalina' in cmdline -%}
          {%- set svc_name = 'tomcat-direct' -%}
        {%- endif -%}

        {%- set svc_name = svc_name | truncate(200, true, '') -%}

        {# ── Clasificación tecnológica por keywords en cmdline ── #}
        {%- set matched = [] -%}
        {%- for entry in svc_disc_rhel_java_technology_map -%}
          {%- if entry.keyword|lower in cmdline|lower and matched|length == 0 -%}
            {%- set _ = matched.append(entry) -%}
          {%- endif -%}
        {%- endfor -%}
        {# También buscar por svc_name en el mapa general #}
        {%- if matched|length == 0 -%}
          {%- for entry in svc_disc_rhel_technology_map -%}
            {%- if entry.keyword|lower in svc_name|lower and matched|length == 0 -%}
              {%- set _ = matched.append(entry) -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {%- set tech = matched[0] if matched|length > 0
                       else {'service_type': svc_disc_rhel_java_default_service_type,
                             'technology': svc_disc_rhel_java_default_technology} -%}

        {# ── Stats de proceso ── #}
        {%- set rss_kb = proc.rss_kb -%}
        {%- set mem_mb = (rss_kb|float / 1024)|round(2) if rss_kb|length > 0 else none -%}

        {# ── Uptime desde etime ── #}
        {%- set etime  = proc.etime -%}
        {%- set uptime = none -%}
        {%- if etime|length > 0 -%}
          {%- set parts = etime.split('-') -%}
          {%- set days  = parts[0]|int if parts|length == 2 else 0 -%}
          {%- set hms   = parts[-1].split(':') -%}
          {%- if   hms|length == 3 -%}{%- set uptime = days*86400 + hms[0]|int*3600 + hms[1]|int*60 + hms[2]|int -%}
          {%- elif hms|length == 2 -%}{%- set uptime = days*86400 + hms[0]|int*60   + hms[1]|int -%}
          {%- else                 -%}{%- set uptime = hms[0]|int -%}
          {%- endif -%}
        {%- endif -%}

        {# ── Puertos del proceso ── #}
        {%- set pid_ports  = (svc_disc_rhel_pid_ports | default({}))[pid] | default([]) -%}
        {%- set protocol   = pid_ports[0].get('protocol',none) if pid_ports|length > 0 else none -%}
        {%- set ports_json = pid_ports|to_json if pid_ports|length > 0 else none -%}

        {# ── Binario desde cmdline (primer token) ── #}
        {%- set binary = cmdline.split()[0] | default(none) -%}

        {%- set _ = ns.svcs.append({
          'service_name': svc_name,
          'service_type': tech.service_type,
          'technology': tech.technology,
          'pid': pid,
          'running_user': proc.user,
          'binary_path': binary,
          'version_detected': (svc_disc_rhel_java_ver_map | default({}))[pid] | default(none),
          'uptime_seconds': uptime,
          'cpu_usage_percent': proc.cpu,
          'memory_usage_mb': mem_mb,
          'protocol': protocol,
          'listening_ports': ports_json,
          'service_status': 'RUNNING',
          'severity': svc_disc_rhel_severity_running,
          'last_state_change_timestamp': none
        }) -%}

      {%- endfor -%}
      {{ ns.svcs }}
    cacheable: false
  tags: [discovery, java]

- name: Svc_disc_rhel | java | Resumen de procesos JVM en {{ inventory_hostname }}
  ansible.builtin.debug:
    msg: >-
      Detectados {{ svc_disc_rhel_java_services | default([]) | length }}
      proceso(s) JVM adicional(es) en {{ inventory_hostname }}.
  tags: [discovery, java]
