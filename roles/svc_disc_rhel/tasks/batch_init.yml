---
# =============================================================================
# roles/svc_disc_rhel/tasks/batch_init.yml
# Variables producidas:
#   svc_disc_rhel_batch_id  — UUID único por ejecución
# =============================================================================

- name: Svc_disc_rhel | Batch_init | Generar UUID (run_once en controller)
  ansible.builtin.set_fact:
    svc_disc_rhel_batch_id: "{{ lookup('community.general.random_string',
                                length=36, special=false) | to_uuid }}"
    cacheable: false
  run_once: true
  delegate_to: localhost
  tags: [batch]

- name: Svc_disc_rhel | Batch_init | INSERT OBS_BATCH_EXECUTION
  opitzconsulting.ansible_oracle.oracle_sql:
    hostname: "{{ svc_disc_rhel_oracle_host }}"
    port: "{{ svc_disc_rhel_oracle_port }}"
    service_name: "{{ svc_disc_rhel_oracle_service }}"
    username: "{{ svc_disc_rhel_oracle_user }}"
    password: "{{ svc_disc_rhel_oracle_password }}"
    mode: "sysdba"
    sql: >-
      INSERT INTO {{ svc_disc_rhel_oracle_schema }}.OBS_BATCH_EXECUTION
        (BATCH_ID, BATCH_EXECUTION_TIMESTAMP, EXECUTION_TYPE, TOTAL_SERVERS)
      VALUES ('{{ svc_disc_rhel_batch_id }}', SYSTIMESTAMP,
              '{{ svc_disc_rhel_execution_type }}', 0)
  environment:
    ORACLE_HOME: /opt/oracle/instantclient
    LD_LIBRARY_PATH: /opt/oracle/instantclient
  vars:
    ansible_python_interpreter: /usr/bin/python3
  no_log: false
  run_once: true
  delegate_to: "{{ svc_disc_rhel_oracle_db_node }}"
  tags: [batch, oracle_insert]

- name: Svc_disc_rhel | Batch_init | Difundir svc_disc_rhel_batch_id a todos los hosts
  ansible.builtin.set_fact:
    svc_disc_rhel_batch_id: "{{ hostvars[ansible_play_hosts[0]]['svc_disc_rhel_batch_id'] }}"
    cacheable: false
  tags: [batch]
